[package]
name = "scandium"
version = "5.0.1"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "scandium_svc"
path = "main.rs"

[dependencies]
ctrlc = "3.5.2"

[build-dependencies]
winresource = "0.1.31"
chrono = "0.4.45"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
